<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D H5 Player</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    /* ========== Reset & Base ========== */
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
      background: #0f0c29;
      color: #fff;
      user-select: none;
      -webkit-user-select: none;
    }

    /* ========== Background Layer ========== */
    #bg-layer {
      position: fixed;
      inset: 0;
      z-index: 0;
      background-size: cover;
      background-position: center;
      transition: background-image 0.8s ease;
    }

    #bg-video {
      position: fixed;
      inset: 0;
      z-index: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    #bg-video[hidden] { display: none; }

    #bg-overlay {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse at 25% 50%, transparent 30%, rgba(0, 0, 0, 0.55) 100%);
      pointer-events: none;
      z-index: 1;
    }

    #gradient-blobs {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      pointer-events: none;
    }
    .gb-blob {
      position: absolute;
      width: 60vmax;
      height: 60vmax;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.40;
      will-change: transform;
    }

    /* ========== Decorative Particles ========== */
    #particles {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      overflow: hidden;
    }
    .particle {
      position: absolute;
      width: 3px;
      height: 3px;
      background: rgba(255, 255, 255, 0.25);
      border-radius: 50%;
      animation: float linear infinite;
    }
    @keyframes float {
      0%   { transform: translateY(100vh) translateX(0) rotate(0deg); opacity: 0; }
      10%  { opacity: 1; }
      90%  { opacity: 1; }
      100% { transform: translateY(-10vh) translateX(40px) rotate(720deg); opacity: 0; }
    }

    /* ========== Toolbar ========== */
    #toolbar {
      position: fixed;
      top: 24px;
      right: 24px;
      z-index: 100;
      display: flex;
      gap: 12px;
    }

    .tool-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: rgba(255, 255, 255, 0.8);
      font-size: 20px;
      cursor: pointer;
      transition: all 0.25s ease;
    }
    .tool-btn:hover {
      background: rgba(255, 255, 255, 0.15);
      transform: scale(1.08);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
    }
    .tool-btn:active {
      transform: scale(0.94);
    }

    /* ========== 3D Perspective Wrapper ========== */
    #perspective-wrapper {
      position: fixed;
      right: 5%;
      top: 50%;
      transform: translateY(-50%);
      z-index: 10;
      perspective: 1000px;
      perspective-origin: right center;
      width: 520px;
      transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* Page load fly-in animation */
    @keyframes flyDown {
      0%   { opacity: 0; transform: rotateY(-9deg) rotateX(2deg) translateY(-100vh); }
      100% { opacity: 1; transform: rotateY(-9deg) rotateX(2deg) translateY(0); }
    }
    @keyframes flyUp {
      0%   { opacity: 0; transform: rotateY(-9deg) rotateX(2deg) translateY(100vh); }
      100% { opacity: 1; transform: rotateY(-9deg) rotateX(2deg) translateY(0); }
    }
    #player-card.fly-in {
      animation: flyDown 1.1s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }
    #lyrics-panel.open.fly-in {
      animation: flyUp 0.9s cubic-bezier(0.22, 1, 0.36, 1) 0.15s forwards;
    }

    /* ========== Player Card ========== */
    #player-card {
      display: flex;
      width: 520px;
      border-radius: 20px;
      overflow: hidden;
      background: rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.10);
      box-shadow:
        0 25px 80px rgba(0, 0, 0, 0.50),
        0 0 0 1px rgba(255, 255, 255, 0.04) inset;
      transform: rotateY(-9deg) rotateX(2deg);
      transform-style: preserve-3d;
      transition: transform 0.45s cubic-bezier(0.25, 0.46, 0.45, 0.94),
                  box-shadow 0.45s ease;
      position: relative;
    }

    /* Glossy sheen */
    #player-card::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background: linear-gradient(
        135deg,
        rgba(255, 255, 255, 0.08) 0%,
        rgba(255, 255, 255, 0.03) 30%,
        transparent 60%
      );
      pointer-events: none;
      z-index: 1;
    }

    /* Hover tilt enhancement */
    #player-card:hover {
      transform: rotateY(-12deg) rotateX(3deg);
      box-shadow:
        0 30px 90px rgba(0, 0, 0, 0.55),
        0 0 0 1px rgba(255, 255, 255, 0.07) inset;
    }

    /* ========== Album Art (Left) ========== */
    #album-art {
      flex: 0 0 auto;
      width: 200px;
      aspect-ratio: 1;
      border-radius: 20px 0 0 20px;
      overflow: hidden;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 10px;
    }

    #album-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    /* Hide broken img icon when no src */
    #album-img[src=""],
    #album-img:not([src]) {
      visibility: hidden;
    }


    /* ========== Info Panel (Right) ========== */
    #info-panel {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 24px 28px;
      gap: 14px;
      position: relative;
      z-index: 2;
    }

    #song-title {
      font-size: 17px;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.92);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      letter-spacing: 0.3px;
      min-height: 24px;
      line-height: 24px;
    }

    #song-title .hint {
      font-weight: 400;
      font-size: 14px;
      color: rgba(255, 255, 255, 0.35);
    }

    /* ========== Progress Section ========== */
    #progress-section {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    /* Custom Range Input */
    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 4px;
      border-radius: 2px;
      background: rgba(255, 255, 255, 0.12);
      outline: none;
      cursor: pointer;
      transition: height 0.2s ease;
    }

    input[type="range"]::-webkit-slider-runnable-track {
      height: 4px;
      border-radius: 2px;
      background: linear-gradient(
        to right,
        rgba(255, 255, 255, 0.50) 0%,
        rgba(255, 255, 255, 0.50) var(--progress, 0%),
        rgba(255, 255, 255, 0.12) var(--progress, 0%),
        rgba(255, 255, 255, 0.12) 100%
      );
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #fff;
      border: 2px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
      margin-top: -5px;
      transition: transform 0.2s ease;
      cursor: grab;
    }

    input[type="range"]::-webkit-slider-thumb:hover {
      transform: scale(1.15);
    }
    input[type="range"]:active::-webkit-slider-thumb {
      cursor: grabbing;
      transform: scale(1.2);
    }

    /* Firefox */
    input[type="range"]::-moz-range-track {
      height: 4px;
      border-radius: 2px;
      background: rgba(255, 255, 255, 0.12);
      border: none;
    }

    input[type="range"]::-moz-range-thumb {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #fff;
      border: 2px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
      cursor: grab;
    }

    input[type="range"]::-moz-range-progress {
      height: 4px;
      border-radius: 2px;
      background: rgba(255, 255, 255, 0.50);
    }

    #time-row {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: rgba(255, 255, 255, 0.40);
      letter-spacing: 0.5px;
      font-variant-numeric: tabular-nums;
    }

    /* ========== Controls ========== */
    #controls {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .ctrl-btn {
      background: none;
      border: none;
      color: rgba(255, 255, 255, 0.75);
      font-size: 22px;
      cursor: pointer;
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      transition: all 0.2s ease;
    }

    .ctrl-btn:hover {
      background: rgba(255, 255, 255, 0.08);
      color: rgba(255, 255, 255, 0.95);
    }
    .ctrl-btn:active {
      transform: scale(0.90);
    }

    #play-btn {
      width: 48px;
      height: 48px;
      font-size: 26px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.10);
      color: rgba(255, 255, 255, 0.90);
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.2);
    }
    #play-btn:hover {
      background: rgba(255, 255, 255, 0.14);
      transform: scale(1.05);
    }
    #play-btn:active {
      transform: scale(0.94);
    }

    /* ========== Volume ========== */
    #volume-section {
      display: flex;
      align-items: center;
      gap: 10px;
      padding-top: 2px;
    }

    #volume-icon {
      font-size: 16px;
      color: rgba(255, 255, 255, 0.40);
      width: 20px;
      text-align: center;
      flex-shrink: 0;
    }

    #volume-slider {
      flex: 1;
      max-width: 100px;
    }

    #volume-slider::-webkit-slider-runnable-track {
      height: 3px;
      border-radius: 2px;
      background: linear-gradient(
        to right,
        rgba(255, 255, 255, 0.40) 0%,
        rgba(255, 255, 255, 0.40) calc(var(--vol-progress, 70) * 1%),
        rgba(255, 255, 255, 0.10) calc(var(--vol-progress, 70) * 1%),
        rgba(255, 255, 255, 0.10) 100%
      );
    }
    #volume-slider::-webkit-slider-thumb {
      width: 11px;
      height: 11px;
      margin-top: -4px;
    }
    #volume-slider::-moz-range-track {
      height: 3px;
    }
    #volume-slider::-moz-range-thumb {
      width: 11px;
      height: 11px;
    }
    #volume-slider::-moz-range-progress {
      height: 3px;
      background: rgba(255, 255, 255, 0.40);
    }

    /* ========== Drop Overlay ========== */
    #drop-overlay {
      position: fixed;
      inset: 0;
      z-index: 200;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      opacity: 0;
      transition: opacity 0.25s ease;
      pointer-events: none;
    }
    #drop-overlay:not([hidden]) {
      opacity: 1;
      pointer-events: auto;
    }
    #drop-overlay[hidden] {
      display: flex !important;
      opacity: 0;
      pointer-events: none;
    }

    #drop-overlay .drop-icon {
      font-size: 56px;
      opacity: 0.6;
      color: rgba(255,255,255,0.6);
    }
    #drop-overlay p {
      font-size: 18px;
      color: rgba(255, 255, 255, 0.60);
      font-weight: 300;
      letter-spacing: 1px;
    }
    #drop-overlay .drop-hint {
      font-size: 13px;
      color: rgba(255, 255, 255, 0.30);
      margin-top: 4px;
    }

    /* ========== Mode Toggle ========== */
    /* ========== Settings Panel ========== */
    #settings-panel {
      position: fixed;
      left: 0;
      top: 0;
      bottom: 0;
      width: 240px;
      z-index: 50;
      background: rgba(255, 255, 255, 0.04);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-right: 1px solid rgba(255, 255, 255, 0.06);
      padding: 80px 16px 20px;
      transform: translateX(-100%);
      transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      overflow-y: auto;
    }
    #settings-panel.open {
      transform: translateX(0);
    }
    .settings-header {
      font-size: 11px;
      color: rgba(255, 255, 255, 0.25);
      letter-spacing: 0.5px;
      text-transform: uppercase;
      margin: 16px 0 8px 4px;
    }
    .settings-header:first-child { margin-top: 0; }
    .settings-item {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      padding: 10px 12px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 10px;
      color: rgba(255, 255, 255, 0.70);
      font-size: 13px;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.2s ease;
      margin-bottom: 4px;
      text-align: left;
    }
    .settings-item:hover {
      background: rgba(255, 255, 255, 0.07);
      color: rgba(255, 255, 255, 0.90);
    }
    .settings-item:active { transform: scale(0.98); }
    .settings-item i {
      width: 18px;
      text-align: center;
      font-size: 14px;
      color: rgba(255, 255, 255, 0.30);
      flex-shrink: 0;
    }
    .settings-item.active {
      background: rgba(99, 130, 255, 0.10);
      border-color: rgba(99, 130, 255, 0.20);
      color: rgba(255, 255, 255, 0.90);
    }
    .settings-item.active i {
      color: rgba(99, 130, 255, 0.60);
    }
    .settings-divider {
      height: 1px;
      background: rgba(255, 255, 255, 0.06);
      margin: 12px 0;
    }
    #settings-panel::-webkit-scrollbar { width: 3px; }
    #settings-panel::-webkit-scrollbar-track { background: transparent; }
    #settings-panel::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 2px; }

    .settings-inline {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 8px;
      padding: 0 10px;
      height: 34px;
      margin-bottom: 4px;
      transition: border-color 0.2s ease;
    }
    .settings-inline:focus-within { border-color: rgba(99,130,255,0.30); }
    .settings-inline i {
      font-size: 12px;
      color: rgba(255,255,255,0.20);
      width: 14px;
      text-align: center;
      flex-shrink: 0;
    }
    .settings-inline input {
      flex: 1;
      background: none;
      border: none;
      outline: none;
      color: rgba(255,255,255,0.70);
      font-size: 12px;
      font-family: inherit;
      height: 100%;
    }
    .settings-inline input::placeholder { color: rgba(255,255,255,0.15); }

    #search-results {
      margin-top: 6px;
      max-height: 180px;
      overflow-y: auto;
      border-radius: 8px;
      background: rgba(255,255,255,0.02);
    }
    #search-results:empty { display: none; }

    .settings-section { margin: 8px 0; }
    .settings-vip-header {
      font-size: 10px;
      color: rgba(255,255,255,0.15);
      margin-bottom: 6px;
    }

    #vip-section { margin: 8px 0; }
    #login-bar { margin-bottom: 6px; }
    #direct-link-box { margin-top: 0; }

    .tool-btn.active {
      background: rgba(99, 130, 255, 0.20);
      border-color: rgba(99, 130, 255, 0.35);
      box-shadow: 0 0 16px rgba(99, 130, 255, 0.15);
    }

    #link-box,
    #search-box {
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 0 14px;
      height: 40px;
      transition: border-color 0.25s ease;
    }
    #link-box:focus-within {
      border-color: rgba(74, 222, 128, 0.40);
    }
    #search-box:focus-within {
      border-color: rgba(99, 130, 255, 0.40);
    }
    #search-box {
      margin-top: 8px;
    }
    #link-box .fa-link {
      color: rgba(74, 222, 128, 0.35);
      font-size: 14px;
      flex-shrink: 0;
    }
    #search-box .fa-search {
      color: rgba(255, 255, 255, 0.30);
      font-size: 14px;
      flex-shrink: 0;
    }
    #link-input,
    #search-input {
      flex: 1;
      background: none;
      border: none;
      outline: none;
      color: rgba(255, 255, 255, 0.85);
      font-size: 13px;
      font-family: inherit;
      height: 100%;
    }
    #link-input::placeholder,
    #search-input::placeholder {
      color: rgba(255, 255, 255, 0.25);
    }

    #search-results {
      margin-top: 8px;
      max-height: 220px;
      overflow-y: auto;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.04);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.06);
    }
    #search-results:empty { display: none; }

    .panel-section {
      margin-bottom: 10px;
    }
    .panel-section:last-of-type {
      margin-bottom: 0;
    }
    .section-label {
      font-size: 10px;
      color: rgba(255, 255, 255, 0.20);
      letter-spacing: 0.5px;
      margin-bottom: 6px;
    }
    #login-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .action-btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: rgba(74, 222, 128, 0.10);
      border: 1px solid rgba(74, 222, 128, 0.15);
      border-radius: 8px;
      padding: 6px 12px;
      color: rgba(255, 255, 255, 0.75);
      font-size: 11px;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.2s ease;
      white-space: nowrap;
    }
    .action-btn:hover {
      background: rgba(74, 222, 128, 0.18);
      color: rgba(255, 255, 255, 0.90);
    }
    .action-btn:active {
      transform: scale(0.96);
    }
    .action-btn .fa-up-right-from-square {
      font-size: 12px;
    }

    #vip-section {
      overflow: hidden;
      max-height: 0;
      opacity: 0;
      transition: max-height 0.3s ease, opacity 0.25s ease;
      margin: 0;
    }
    #vip-section.open {
      max-height: 120px;
      opacity: 1;
      margin: 10px 0 0;
    }
    .login-hint {
      font-size: 10px;
      color: rgba(255, 255, 255, 0.18);
      line-height: 1.3;
    }

    #direct-link-box {
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 10px;
      padding: 0 12px;
      height: 34px;
      margin-top: 6px;
      transition: border-color 0.25s ease;
    }
    #direct-link-box:focus-within {
      border-color: rgba(74, 222, 128, 0.30);
    }
    #direct-link-box .fa-arrow-right-to-bracket {
      color: rgba(74, 222, 128, 0.25);
      font-size: 12px;
      flex-shrink: 0;
    }
    #direct-link-input {
      flex: 1;
      background: none;
      border: none;
      outline: none;
      color: rgba(255, 255, 255, 0.70);
      font-size: 12px;
      font-family: inherit;
      height: 100%;
    }
    #direct-link-input::placeholder {
      color: rgba(255, 255, 255, 0.18);
    }

    /* ========== Toast Notifications ========== */
    #toast-container {
      position: fixed;
      bottom: 24px;
      right: 24px;
      z-index: 9999;
      display: flex;
      flex-direction: column-reverse;
      gap: 8px;
      pointer-events: none;
    }

    .toast {
      background: rgba(255, 255, 255, 0.04);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.07);
      border-radius: 10px;
      padding: 12px 16px 10px;
      min-width: 200px;
      max-width: 340px;
      transform: translateX(120%);
      opacity: 0;
      transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1),
                  opacity 0.30s ease;
      pointer-events: auto;
      overflow: hidden;
    }

    .toast.enter {
      transform: translateX(0);
      opacity: 1;
    }

    .toast.exit {
      transform: translateX(120%);
      opacity: 0;
      transition: transform 0.30s cubic-bezier(0.55, 0, 1, 0.45),
                  opacity 0.25s ease;
    }

    .toast-body {
      font-size: 13px;
      color: rgba(255, 255, 255, 0.82);
      line-height: 1.45;
      word-break: break-word;
    }

    .toast-bar-track {
      margin-top: 8px;
      height: 2px;
      background: rgba(255, 255, 255, 0.06);
      border-radius: 1px;
      overflow: hidden;
    }

    .toast-bar-fill {
      height: 100%;
      width: 100%;
      background: linear-gradient(90deg, rgba(255,255,255,0.15), rgba(255,255,255,0.40));
      border-radius: 1px;
      transition: width linear;
    }

    /* Error toast — pink glass */
    .toast.error {
      background: rgba(40, 8, 18, 0.25);
      border-color: rgba(255, 80, 120, 0.18);
    }
    .toast.error .toast-body {
      color: rgba(255, 160, 180, 0.90);
    }
    .toast.error .toast-bar-fill {
      background: linear-gradient(90deg, rgba(255,80,120,0.20), rgba(255,80,120,0.50));
    }

    @media (max-width: 600px) {
      #toast-container {
        bottom: 16px;
        right: 16px;
        left: 16px;
      }
      .toast {
        max-width: none;
        min-width: 0;
      }
    }

    .search-result-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 14px;
      cursor: pointer;
      transition: background 0.2s ease;
      border-bottom: 1px solid rgba(255, 255, 255, 0.04);
    }
    .search-result-item:last-child {
      border-bottom: none;
    }
    .search-result-item:hover {
      background: rgba(255, 255, 255, 0.06);
    }
    .search-result-item:active {
      background: rgba(255, 255, 255, 0.10);
    }

    .search-result-thumb {
      width: 36px;
      height: 36px;
      border-radius: 6px;
      object-fit: cover;
      flex-shrink: 0;
      background: rgba(255, 255, 255, 0.06);
    }

    .search-result-info {
      flex: 1;
      min-width: 0;
    }
    .search-result-name {
      font-size: 13px;
      color: rgba(255, 255, 255, 0.85);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .search-result-artist {
      font-size: 11px;
      color: rgba(255, 255, 255, 0.35);
      margin-top: 1px;
    }
    .search-result-dur {
      font-size: 11px;
      color: rgba(255, 255, 255, 0.25);
      flex-shrink: 0;
    }

    /* scrollbar for search */
    #search-results::-webkit-scrollbar {
      width: 4px;
    }
    #search-results::-webkit-scrollbar-track {
      background: transparent;
    }
    #search-results::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.12);
      border-radius: 2px;
    }

    .search-status {
      padding: 16px;
      text-align: center;
      font-size: 12px;
      color: rgba(255, 255, 255, 0.25);
    }

    /* ========== Lyrics Panel ========== */
    #lyrics-panel {
      margin-top: 14px;
      width: 100%;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.04);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.06);
      font-size: 13px;
      color: rgba(255, 255, 255, 0.30);
      transform-style: preserve-3d;
      display: flex;
      flex-direction: column;

      overflow: hidden;
      max-height: 0;
      opacity: 0;
      transform: rotateY(-9deg) rotateX(2deg) translateY(-10px);
      padding: 0 0;
      transition: max-height 0.35s cubic-bezier(0.4, 0, 0.2, 1),
                  opacity 0.25s ease,
                  transform 0.30s ease,
                  padding 0.25s ease;
    }
    #lyrics-panel.open {
      max-height: 300px;
      opacity: 1;
      transform: rotateY(-9deg) rotateX(2deg) translateY(0);
      padding: 16px 18px 0;
    }

    /* Disable transitions during drag resize */
    #lyrics-panel.resizing {
      transition: none !important;
    }

    #lyrics-content {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      overflow-x: hidden;
      line-height: 1.7;
      scroll-behavior: smooth;
    }
    #lyrics-content::-webkit-scrollbar { width: 3px; }
    #lyrics-content::-webkit-scrollbar-track { background: transparent; }
    #lyrics-content::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 2px; }

    #lyrics-resize-handle {
      flex-shrink: 0;
      height: 10px;
      cursor: ns-resize;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.2s ease;
      margin-top: 4px;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }
    #lyrics-panel.open #lyrics-resize-handle {
      opacity: 1;
    }
    #lyrics-resize-handle:hover {
      opacity: 1;
    }
    #lyrics-resize-handle .fa-grip-lines {
      font-size: 12px;
      color: rgba(255, 255, 255, 0.15);
      pointer-events: none;
    }

    .lyric-line {
      transition: color 0.3s ease, font-size 0.3s ease;
      color: rgba(255, 255, 255, 0.30);
      text-align: center;
      padding: 2px 0;
      min-height: 1.7em;
    }
    .lyric-line.active {
      color: rgba(255, 255, 255, 0.85);
      font-size: 15px;
    }


    /* ========== Online artist display ========== */
    .online-artist {
      font-size: 12px;
      color: rgba(255, 255, 255, 0.35);
      font-weight: 400;
      margin-top: 1px;
    }
    .vip-hint {
      font-size: 11px;
      color: rgba(255, 160, 100, 0.6);
      font-weight: 400;
    }

    /* ========== Responsive ========== */
    @media (max-width: 900px) {
      #perspective-wrapper {
        width: 460px;
      }
      #player-card {
        width: 100%;
      }
      #album-art {
        width: 160px;
      }
      #info-panel {
        padding: 20px 22px;
        gap: 12px;
      }
      #song-title {
        font-size: 15px;
      }
    }

    @media (max-width: 600px) {
      #perspective-wrapper {
        right: 50%;
        transform: translate(50%, -50%);
        width: min(92vw, 420px);
      }
      #player-card {
        width: 100%;
        flex-direction: column;
        transform: rotateY(-5deg) rotateX(2deg);
        border-radius: 18px;
      }
      #player-card:hover {
        transform: rotateY(-7deg) rotateX(3deg);
      }
      #lyrics-panel {
        transform: rotateY(-5deg) rotateX(2deg) translateY(-10px);
      }
      #lyrics-panel.open {
        transform: rotateY(-5deg) rotateX(2deg) translateY(0);
      }
      #album-art {
        width: 100%;
        aspect-ratio: 1;
        border-radius: 18px 18px 0 0;
        max-height: 180px;
      }
      #info-panel {
        padding: 16px 20px;
        gap: 10px;
      }
      #toolbar {
        top: 16px;
        right: 16px;
        gap: 10px;
      }
      .tool-btn {
        width: 38px;
        height: 38px;
        font-size: 17px;
      }
    }

    @media (max-width: 400px) {
      #player-card {
        width: 94vw;
      }
      #info-panel {
        padding: 14px 16px;
      }
      #play-btn {
        width: 42px;
        height: 42px;
        font-size: 22px;
      }
    }

    /* ========== Loading state ========== */
    .loading-dots::after {
      content: '';
      animation: dots 1.2s steps(3, end) infinite;
    }
    @keyframes dots {
      0%   { content: ''; }
      33%  { content: '.'; }
      66%  { content: '..'; }
      100% { content: '...'; }
    }
  </style>
